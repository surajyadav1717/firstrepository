<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Person List</title>
    <style>
        table { border-collapse: collapse; width: 80%; margin: auto; }
        th, td { padding: 10px; border: 1px solid #ccc; text-align: center; }
        th { background-color: #f2f2f2; }
        a { margin: 0 5px; }
    </style>
</head>
<body>

<h2 style="text-align:center;">Person List</h2>

<div style="text-align:center; margin-bottom: 15px;">
    <a th:href="@{/add}">Add New Person</a> |
    <a th:href="@{/logout}">Logout</a>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>City</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="person : ${persons}">
            <td th:text="${person.id}"></td>
            <td th:text="${person.fullName}"></td>
            <td th:text="${person.email}"></td>
            <td th:text="${person.city}"></td>
            <td>
                <a th:href="@{/edit/{id}(id=${person.id})}">Edit</a>
				<a th:href="@{/delete/{id}(id=${person.id})}" onclick="return confirm('Are you sure?')">Delete</a>
				 <a href="/persons/pdf" class="btn btn-success" target="_blank">Download PDF</a>
				 

            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
